name = "loop-db"
main = "src/worker.ts"
compatibility_date = "2024-01-01"
# Pin to the Longhorn Developers account; the login token can also see a
# personal account, which makes wrangler ambiguous in non-interactive mode.
account_id = "9f38fafdc1cf403ddb29934c9992449f"

[[d1_databases]]
binding = "DB"
database_name = "loop-db"
database_id = "dc2be36a-b3b9-45a5-9fc8-fb223eb336bf"

[[r2_buckets]]
binding = "EVENT_IMAGES"
bucket_name = "longhorn-loop-event-images"

# Workers AI: gives c.env.AI for running embedding models at ingest.
[ai]
binding = "AI"

# Vectorize: stores the ~70 taxonomy tag vectors that events are matched
# against at ingest. Index created via:
#   npx wrangler vectorize create loop-event-tags --dimensions=1024 --metric=cosine
[[vectorize]]
binding = "VECTORIZE"
index_name = "loop-event-tags"

[triggers]
# Both schedules fire the same scheduled() handler in worker.ts, which
# dispatches on event.cron:
#   "0 */6 * * *"  -> scrapes Texas Today + HornsLink for new/updated events
#   "*/15 * * * *" -> checks saved/bookmarked events for upcoming start
#                      times and creates reminder notifications
#   "0 8 * * *"    -> LOOP-241: sweeps the HornsLink ORG directory (orgs only,
#                      no events) and tops up missing contact emails
crons = ["0 */6 * * *", "*/15 * * * *", "0 8 * * *"]

# Set your JWT secret as a Workers secret (not in this file):
#   wrangler secret put JWT_SECRET

[vars]
EVENT_IMAGE_PUBLIC_BASE_URL = "https://pub-1fa687f6640643bc900bbbc25e3aba0c.r2.dev"
# Verification-code sender. Must be a domain verified with whichever provider
# EMAIL_PROVIDER selects, or every send fails.
#
# UT's Proofpoint gateway currently REJECTS longhornloop.me outright:
#   550 #5.7.1 Your access to submit messages to this e-mail system has been rejected.
# Switching to longhorndevelopers.org is the likely fix — an older .org tied to
# a real student org, already in this Cloudflare account:
#   EMAIL_FROM = "Longhorn Loop <noreply@longhorndevelopers.org>"
EMAIL_FROM = "Longhorn Loop <noreply@longhornloop.me>"

# Which provider sends. 'cloudflare' | 'postmark' | 'resend' | 'dev'.
# See server/src/email/send.ts for why this is a variable and not a decision.
EMAIL_PROVIDER = "resend"

# Cloudflare Email Service. Uncomment AFTER onboarding the domain under
# Compute > Email Service > Email Sending (it writes the DNS itself), then set
# EMAIL_PROVIDER = "cloudflare". Requires the Workers Paid plan.
# [[send_email]]
# name = "EMAIL"