name = "loop-db"
main = "src/worker.ts"
compatibility_date = "2024-01-01"
# Pin to the Longhorn Developers account; the login token can also see a
# personal account, which makes wrangler ambiguous in non-interactive mode.
account_id = "9f38fafdc1cf403ddb29934c9992449f"

[[d1_databases]]
binding = "DB"
database_name = "loop-db"
database_id = "dc2be36a-b3b9-45a5-9fc8-fb223eb336bf"

[[r2_buckets]]
binding = "EVENT_IMAGES"
bucket_name = "longhorn-loop-event-images"

# Workers AI: used for structured LLM event-tag classification at ingest.
[ai]
binding = "AI"

# This Worker, bound to itself (LOOP-309). The scrape cron dispatches each
# scraper through it so every scraper gets its own invocation and its own
# per-invocation limits. A plain fetch() to our own workers.dev URL does not
# get there -- see scheduled() in src/worker.ts. Deliberately NOT repeated
# under [env.local]: wrangler dev has no service bindings, and the code falls
# back to WORKER_URL there.
[[services]]
binding = "SELF"
service = "loop-db"

[triggers]
# ONE trigger (LOOP-295). Cron Triggers are a per-account budget on Workers
# Free, shared by every Longhorn Developers project; Loop used to hold four of
# the five. Every 15 minutes is the tightest cadence any job needs, and
# scheduled() in src/worker.ts asks jobsDue() in src/lib/schedule.ts which jobs
# fall on each tick, from the tick's scheduled time in UTC:
#   every tick         -> reminder notifications for saved events starting soon
#   00/06/12/18:00     -> every scraper in SCRAPERS (the event sweep)
#   08:00              -> LOOP-241: HornsLink ORG directory (orgs only, no
#                         events) and missing contact emails
#   09:00              -> LOOP-150: archive expired events a user created,
#                         RSVP'd to or saved; hard-delete the rest. Kept an
#                         hour after the org sweep so two heavy D1 jobs don't
#                         share a tick (a choice now, not a constraint).
# Adding a job means a line in jobsDue(), not a new trigger here.
crons = ["*/15 * * * *"]

# Set your JWT secret as a Workers secret (not in this file):
#   wrangler secret put JWT_SECRET
#   wrangler secret put CRON_SECRET

[vars]
WORKER_URL = "https://loop-db.longhorn-developers.workers.dev"
EVENT_IMAGE_PUBLIC_BASE_URL = "https://pub-1fa687f6640643bc900bbbc25e3aba0c.r2.dev"
# Verification-code sender. Must be a domain verified with whichever provider
# EMAIL_PROVIDER selects, or every send fails.
#
# DO NOT change this to a newly registered domain without re-testing delivery
# to a real @utexas.edu address. UT's gateway is Proofpoint, and it rejected
# longhornloop.me — registered that same morning — at the SMTP handshake:
#
#   550 #5.7.1 Your access to submit messages to this e-mail system has been rejected.
#
# The identical message went through from longhorndevelopers.org minutes later,
# on the same Resend account and the same Amazon SES IP pool. Only the sending
# domain differed, so the block was on the domain, not the infrastructure — an
# aged .org with a real organisation behind it passes where a fresh .me does not.
EMAIL_FROM = "Longhorn Loop <noreply@longhorndevelopers.org>"

# Which provider sends. 'cloudflare' | 'postmark' | 'resend' | 'dev'.
# See server/src/email/send.ts for why this is a variable and not a decision.
EMAIL_PROVIDER = "resend"

# Cloudflare Email Service. Uncomment AFTER onboarding the domain under
# Compute > Email Service > Email Sending (it writes the DNS itself), then set
# EMAIL_PROVIDER = "cloudflare". Requires the Workers Paid plan.
# [[send_email]]
# name = "EMAIL"

# ---------------------------------------------------------------------------
# Local development environment: `wrangler dev --env local`, via `npm run dev`.
#
# WHY THIS EXISTS
#
# Workers AI has no local emulation. When wrangler sees the top-level [ai]
# binding it opens a "remote proxy session"
# against this account before it will serve a single request, so `wrangler dev`
# fails outright for anyone not signed in to the Longhorn Developers Cloudflare
# account:
#
#   [ERROR] A request to the Cloudflare API
#           (/accounts/9f38.../workers/subdomain/edge-preview) failed.
#   [ERROR] Failed to start the remote proxy session.
#
# The AI binding is only used by the ingest/tagging path. Nothing a person
# clicks in normal local app development requires it. The local environment
# intentionally omits AI, so tagging falls back to the keyword classifier.
#
# Bindings are NOT inherited by named environments in wrangler — that is a
# footgun most of the time and exactly what we want here, but it does mean DB,
# R2 and vars have to be repeated below. If you add a binding above that the
# app needs at request time, add it here too.
# ---------------------------------------------------------------------------
[env.local]

# The id is deliberately not the real one. `--local` keys its SQLite file off
# it and never validates it, so local dev is unaffected — but it means a
# stray `wrangler deploy --env local` fails on an invalid database id instead
# of quietly standing up a second Worker wired to the PRODUCTION database.
# We have already had one orphaned Worker firing crons at prod; once is enough.
[[env.local.d1_databases]]
binding = "DB"
database_name = "loop-db"
database_id = "local-only-never-deploy"

[[env.local.r2_buckets]]
binding = "EVENT_IMAGES"
bucket_name = "longhorn-loop-event-images"

[env.local.vars]
EVENT_IMAGE_PUBLIC_BASE_URL = "https://pub-1fa687f6640643bc900bbbc25e3aba0c.r2.dev"
EMAIL_FROM = "Longhorn Loop <noreply@longhorndevelopers.org>"
# 'dev', not 'resend': codes print to the wrangler console. Local dev cannot
# send real mail even if someone has a live RESEND_API_KEY in their .dev.vars,
# which matters while the account is on a 100/day free tier that the beta needs.
EMAIL_PROVIDER = "dev"
